}
document.addEventListener("change",function(e){
 if(e.target.matches(".draft")){syncActivity();if(["ruleMode","scopeMode","timeMode"].indexOf(e.target.dataset.key)>-1)activityView()}
 if(e.target.matches("[data-material-key]")){syncMaterials();if(e.target.dataset.materialKey==="jumpMode")materialRows()}
 if(e.target.matches("[data-upload]")){var f=e.target.files[0];if(f){syncMaterials();state.activityDraft._materials[+e.target.dataset.upload].resource="已上传："+f.name;materialRows()}}
 if(e.target.matches("[data-audience-key]")){syncTask();taskView()}
 if(e.target.matches("[data-condition-key='metric']")){syncTask();var q=state.taskDraft.conditions[+e.target.closest(".condition-row").dataset.index],m=metrics[q.metric];q.operator=m.ops[0];q.target=m.kind==="state"?m.values[0]:"1";taskView()}
 if(e.target.matches(".task-input")){syncTask();if(["timeMode","reset","rewardEnabled","limit"].indexOf(e.target.dataset.key)>-1){if(state.taskDraft.limit>1&&state.taskDraft.conditionRelation.indexOf("或")===0)state.taskDraft.conditionRelation="且（全部满足）";taskView()}}
});
document.addEventListener("click",function(e){
 var b=e.target.closest("[data-action],[data-go]");if(!b)return;var a=b.dataset.action,g=b.dataset.go;
 if(g){if(g==="detail"&&state.view==="data")state.tab="basic";if(g==="detail"&&state.view==="component")state.tab="component";go(g);return}
 if(a==="new-activity"){state.activityDraft=blankActivity();go("activity")}
 if(a==="edit-activity"){var ac=activities.find(function(x){return x.id===b.dataset.id});if(ac.status==="上架")return toast("活动上架期间配置只读");state.activityDraft=copy(ac);state.activityDraft._stages=copy(aStages(ac.id));state.activityDraft._materials=copy(aMaterials(ac.id));go("activity")}
 if(a==="save-activity")saveActivity();
 if(a==="search"){state.query=$("#listQuery").value.trim();state.status=$("#listStatus").value;listView()}
 if(a==="reset-search"){state.query="";state.status="";listView()}
 if(a==="detail"){state.activityId=b.dataset.id;state.tab="basic";go("detail")}
 if(a==="toggle-activity")toggleActivity(b.dataset.id||state.activityId);
 if(a==="open-data"){state.activityId=b.dataset.id;state.dataUser="";state.dataCategory="";go("data")}
 if(a==="tab"){state.tab=b.dataset.tab;detailBody()}
 if(a==="add-stage"){syncActivity();syncStages();state.activityDraft._stages.push({id:"",name:"",order:state.activityDraft._stages.length+1,start:state.activityDraft.start,end:state.activityDraft.end,description:""});stageRows()}
 if(a==="remove-stage"){syncStages();state.activityDraft._stages.splice(+b.dataset.index,1);stageRows()}
 if(a==="add-material"){syncMaterials();state.activityDraft._materials.push({id:"",position:state.activityDraft.ruleMode==="图片"&&!state.activityDraft._materials.some(function(x){return x.position==="活动规则图"})?"活动规则图":"活动头图",terminal:"通用",resource:"",alt:"",jumpMode:"无跳转",target:"",order:1});materialRows()}
 if(a==="remove-material"){syncMaterials();state.activityDraft._materials.splice(+b.dataset.index,1);materialRows()}
 if(a==="add-component")addComponent();
 if(a==="open-component"){state.componentId=b.dataset.id;go("component")}
 if(a==="new-task"){state.taskDraft=blankTask();state.sourceTaskId="";go("task")}
 if(a==="edit-task"){var t=tasks.find(function(x){return x.id===b.dataset.id});state.taskDraft=copy(t);state.sourceTaskId=t.id;go("task")}
 if(a==="copy-task"){var ct=tasks.find(function(x){return x.id===b.dataset.id});state.taskDraft=blankTask(ct);state.sourceTaskId=ct.id;go("task")}
 if(a==="delete-task"){var ix=tasks.findIndex(function(x){return x.id===b.dataset.id});if(ix>-1){var dt=tasks[ix];tasks.splice(ix,1);log(component().activityId,"任务",dt.id,"删除草稿","从任务组件草稿中删除任务");toast("任务草稿已删除");componentView()}}
 if(a==="publish-component")publishComponent();
 if(a==="save-task")saveTask();
 if(a==="add-audience"){syncTask();state.taskDraft.audiences.push({type:"新注册用户",value:""});taskView()}
 if(a==="remove-audience"){syncTask();state.taskDraft.audiences.splice(+b.dataset.index,1);taskView()}
 if(a==="add-condition"){syncTask();state.taskDraft.conditions.push({metric:"PUBG排位模式胜场",operator:"大于等于",target:"1"});taskView()}
 if(a==="remove-condition"){syncTask();state.taskDraft.conditions.splice(+b.dataset.index,1);taskView()}
 if(a==="add-reward"){syncTask();state.taskDraft.rewards.push({ref:"",qty:1});taskView()}
 if(a==="remove-reward"){syncTask();state.taskDraft.rewards.splice(+b.dataset.index,1);taskView()}
 if(a==="search-data"){state.dataUser=$("#dataUser").value.trim();state.dataCategory=$("#dataCategory").value;dataView()}
 if(a==="reset-data"){state.dataUser="";state.dataCategory="";dataView()}
});
window.__prototype={activities:activities,stages:stages,materials:materials,components:components,tasks:tasks,facts:facts,events:events,metrics:metrics,activityError:activityError,taskError:taskError};
render();
})();
</script>
</body>
</html>
