<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NN 营销活动组件管理后台原型</title>
  <style>
    :root {
      --navy: #061c30;
      --navy-2: #06233b;
      --blue: #1688ff;
      --blue-active: #1f93f4;
      --green: #66c354;
      --red: #e64b4b;
      --orange: #d88920;
      --bg: #eef1f5;
      --surface: #ffffff;
      --surface-soft: #f6f7f9;
      --line: #dfe3e8;
      --line-soft: #edf0f3;
      --text: #222222;
      --muted: #707782;
      --weak: #9aa1aa;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html,
    body {
      margin: 0;
      min-width: 1280px;
      min-height: 100%;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      font-size: 14px;
    }

    button,
    input,
    select,
    textarea { font: inherit; }

    button,
    .link { cursor: pointer; }

    .admin-shell {
      display: flex;
      min-height: 100vh;
    }

    .admin-side {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 20;
      width: 236px;
      min-height: 100vh;
      color: #fff;
      background: var(--navy);
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.12);
    }

    .admin-logo {
      display: flex;
      align-items: center;
      height: 66px;
      padding: 0 24px;
      background: var(--navy-2);
      font-size: 20px;
      font-weight: 800;
    }

    .admin-logo-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      margin-right: 10px;
      border-radius: 6px;
      color: #fff;
      background: #ff4f6d;
      font-size: 14px;
    }

    .admin-search { padding: 10px 22px 18px; }
    .admin-search input {
      width: 100%;
      height: 34px;
      padding: 0 14px;
      border: 0;
      border-radius: 18px;
      outline: none;
      color: #24364a;
      background: rgba(255, 255, 255, 0.76);
    }

    .admin-menu-title {
      margin: 14px 0 8px;
      padding: 0 26px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
    }

    .admin-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      height: 48px;
      padding: 0 26px;
      border: 0;
      color: rgba(255, 255, 255, 0.84);
      background: transparent;
      text-align: left;
      font-size: 15px;
    }

    .admin-menu-item:hover { background: rgba(255, 255, 255, 0.06); }
    .admin-menu-item.active {
      color: #fff;
      background: var(--blue-active);
      font-weight: 700;
    }

    .admin-menu-item.disabled {
      color: rgba(255, 255, 255, 0.32);
      cursor: not-allowed;
    }

    .menu-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.8;
    }

    .side-note {
      position: absolute;
      right: 22px;
      bottom: 20px;
      left: 22px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.11);
      color: rgba(255, 255, 255, 0.46);
      font-size: 12px;
      line-height: 1.65;
    }

    .admin-main {
      width: calc(100% - 236px);
      min-width: 0;
      margin-left: 236px;
    }

    .admin-topbar {
      position: sticky;
      top: 0;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      padding: 0 30px;
      border-bottom: 1px solid #e6e9ee;
      background: #fff;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .hamburger { font-size: 24px; color: #111; }
    .crumb { color: var(--muted); font-size: 13px; }
    .crumb strong { color: #222; }

    .admin-user {
      display: flex;
      align-items: center;
      gap: 24px;
      color: #111;
      font-size: 14px;
    }

    .admin-tabs {
      position: sticky;
      top: 64px;
      z-index: 14;
      display: flex;
      align-items: center;
      gap: 22px;
      height: 56px;
      padding: 0 36px;
      border-bottom: 1px solid #d7dce3;
      background: #fff;
    }

    .admin-tab {
      display: inline-flex;
      align-items: center;
      height: 56px;
      padding: 0 8px;
      border: 0;
      color: #333;
      background: transparent;
      font-size: 14px;
    }

    .admin-tab.active {
      color: var(--blue);
      border-bottom: 2px solid var(--blue);
      font-weight: 700;
    }

    .admin-content {
      margin: 14px;
      padding: 26px;
      min-height: calc(100vh - 148px);
      background: #fff;
    }

    .page { display: none; }
    .page.active { display: block; }

    .page-title {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 22px;
    }

    .page-title h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }

    .page-title p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .actions,
    .toolbar,
    .inline {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toolbar {
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .toolbar-spacer { flex: 1; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 86px;
      height: 34px;
      padding: 0 16px;
      border: 1px solid #d8dde5;
      border-radius: 4px;
      color: #333;
      background: #fff;
      font-size: 14px;
    }

    .btn:hover { filter: brightness(0.98); }
    .btn.blue { border-color: var(--blue); color: #fff; background: var(--blue); }
    .btn.green { border-color: var(--green); color: #fff; background: var(--green); }
    .btn.red { border-color: var(--red); color: #fff; background: var(--red); }
    .btn.ghost { background: #f8f9fb; }
    .btn.small { min-width: auto; height: 30px; padding: 0 11px; font-size: 12px; }
    .btn.text { min-width: auto; height: auto; padding: 0; border: 0; color: var(--blue); background: transparent; }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .stat-card {
      padding: 18px 20px;
      border: 1px solid #e7ebf0;
      border-radius: 4px;
      background: #fafbfc;
    }

    .stat-card span { display: block; color: var(--muted); font-size: 13px; }
    .stat-card strong { display: block; margin-top: 8px; font-size: 26px; line-height: 1.1; }
    .stat-card small { display: block; margin-top: 7px; color: var(--weak); }

    .input,
    .select,
    .textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 4px;
      outline: none;
      color: #333;
      background: #fff;
    }

    .input,
    .select { height: 34px; padding: 0 12px; }
    .textarea { min-height: 86px; padding: 10px 12px; resize: vertical; line-height: 1.55; }
    .toolbar .input { width: 240px; }
    .toolbar .select { width: 180px; }
    .input:focus,
    .select:focus,
    .textarea:focus { border-color: #79baff; box-shadow: 0 0 0 2px rgba(22, 136, 255, 0.08); }

    .table-wrap {
      border: 1px solid #e1e5ea;
      overflow-x: auto;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .table th {
      height: 48px;
      color: #222;
      background: #f6f7f9;
      font-size: 13px;
      font-weight: 700;
    }

    .table td {
      height: 66px;
      border-top: 1px solid var(--line-soft);
      color: #454b52;
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
      vertical-align: middle;
    }

    .table th,
    .table td {
      padding: 8px 10px;
      border-right: 1px solid var(--line-soft);
      word-break: break-word;
    }

    .table th:last-child,
    .table td:last-child { border-right: 0; }
    .table .text-left { text-align: left; }
    .table .nowrap { white-space: nowrap; }
    .table tr:hover td { background: #fbfdff; }

    .table-actions {
      display: flex;
      justify-content: center;
      gap: 9px;
      color: var(--blue);
      white-space: nowrap;
    }

    .link { color: var(--blue); }
    .muted { color: var(--muted); }
    .weak { color: var(--weak); }
    .danger { color: var(--red); }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 54px;
      min-height: 24px;
      padding: 3px 9px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
    }

    .badge.live { color: #12a150; background: #e7f8ed; }
    .badge.warn { color: #c47b00; background: #fff1d6; }
    .badge.blue { color: var(--blue); background: #e7f1ff; }
    .badge.purple { color: #6536d8; background: #f0e8ff; }
    .badge.red { color: #d72828; background: #ffeaea; }
    .badge.gray { color: #6b7280; background: #eef0f3; }
    .badge.dark { color: #fff; background: #44515f; }

    .pagination {
      display: flex;
      justify-content: flex-end;
      gap: 14px;
      padding: 18px 4px 0;
      color: #555;
      font-size: 13px;
    }

    .form-stack { display: grid; gap: 18px; }
    .rule-card {
      padding: 20px;
      border: 1px solid #e1e5ea;
      border-radius: 4px;
      background: #fff;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 16px;
    }

    .section-title h2 { margin: 0; font-size: 18px; line-height: 1.2; }
    .section-title p,
    .section-title span { margin: 0; color: var(--muted); font-size: 13px; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px 22px;
    }

    .form-row { min-width: 0; }
    .form-row.full { grid-column: 1 / -1; }
    .form-row.double { grid-column: span 2; }

    .form-row label {
      display: block;
      margin-bottom: 8px;
      color: #2d333b;
      font-size: 13px;
      font-weight: 700;
    }

    .required::before { content: "* "; color: #f04438; }
    .hint { display: block; margin-top: 7px; color: #7b838f; font-size: 12px; line-height: 1.45; }

    .choice-row {
      display: flex;
      align-items: center;
      gap: 18px;
      min-height: 34px;
    }

    .choice-row label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0;
      font-weight: 400;
    }

    .choice-row input { accent-color: var(--blue); }

    .scope-note,
    .info-note,
    .warning-note {
      display: flex;
      align-items: flex-start;
      min-height: 42px;
      margin-bottom: 16px;
      padding: 12px 14px;
      border: 1px solid #dbe8f8;
      border-radius: 4px;
      color: #4e6074;
      background: #f7fbff;
      font-size: 13px;
      line-height: 1.6;
    }

    .scope-note strong,
    .info-note strong { margin-right: 8px; color: #242a32; }
    .warning-note { border-color: #f1dfb4; color: #79602b; background: #fffaf0; }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0;
      border: 1px solid #e4e8ed;
    }

    .detail-item {
      display: grid;
      grid-template-columns: 118px 1fr;
      min-height: 52px;
      border-right: 1px solid #e4e8ed;
      border-bottom: 1px solid #e4e8ed;
      font-size: 13px;
    }

    .detail-item:nth-child(3n) { border-right: 0; }
    .detail-item dt,
    .detail-item dd { display: flex; align-items: center; margin: 0; padding: 10px 12px; }
    .detail-item dt { color: var(--muted); background: #f7f8fa; }
    .detail-item dd { color: #30343a; }

    .capability-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px;
      border: 1px solid #d9e8fa;
      border-left: 4px solid var(--blue);
      border-radius: 4px;
      background: #fbfdff;
    }

    .capability-main { display: flex; align-items: center; gap: 16px; }
    .capability-icon {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 8px;
      color: #fff;
      background: var(--blue);
      font-weight: 800;
    }

    .capability-main h3 { margin: 0 0 6px; font-size: 16px; }
    .capability-main p { margin: 0; color: var(--muted); font-size: 13px; }

    .stepbar {
      display: flex;
      align-items: center;
      gap: 0;
      margin-bottom: 18px;
      padding: 12px 18px;
      border: 1px solid #e4e8ed;
      background: #fafbfc;
    }

    .step {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 150px;
      color: var(--muted);
      font-size: 13px;
    }

    .step::after {
      content: "";
      width: 42px;
      height: 1px;
      margin: 0 12px;
      background: #d9dee5;
    }

    .step:last-child::after { display: none; }
    .step-index {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      color: #fff;
      background: #b2bac4;
      font-size: 12px;
    }

    .step.active { color: var(--blue); font-weight: 700; }
    .step.active .step-index,
    .step.done .step-index { background: var(--blue); }
    .step.done { color: #3a4755; }

    .condition-box {
      margin-top: 14px;
      padding: 14px;
      border: 1px solid #dce5ef;
      border-radius: 4px;
      background: #f9fbfd;
    }

    .condition-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .condition-head strong { font-size: 13px; }
    .condition-grid {
      display: grid;
      grid-template-columns: 1fr 1.55fr 1fr 0.95fr 0.75fr 1.2fr 54px;
      gap: 10px;
      align-items: end;
    }

    .mini-label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; }
    .remove-condition { height: 34px; border: 1px solid #f0c7c7; border-radius: 4px; color: var(--red); background: #fff6f6; }

    .reward-list { display: grid; gap: 10px; }
    .reward-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 0.7fr 80px;
      gap: 10px;
      align-items: end;
    }

    .metric-chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 3px;
      color: #475467;
      background: #f0f2f5;
      font-size: 12px;
    }

    .timeline {
      position: relative;
      display: grid;
      gap: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .timeline::before {
      content: "";
      position: absolute;
      top: 18px;
      bottom: 18px;
      left: 86px;
      width: 1px;
      background: #dfe5ec;
    }

    .timeline-item {
      position: relative;
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 30px;
      min-height: 68px;
      padding: 9px 0;

    .timeline-time { color: var(--muted); font-size: 12px; text-align: right; }

      height: 9px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 1px #b8d8fb;
    }

    .timeline-body strong { display: block; margin-bottom: 5px; font-size: 13px; }
    .timeline-body span { color: var(--muted); font-size: 12px; line-height: 1.55; }

    .drawer-mask,
    .modal-mask {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      background: rgba(13, 28, 43, 0.34);
    }

    .drawer-mask.open,
    .modal-mask.open { display: block; }

    .drawer {
      position: absolute;
      top: 0;
      right: 0;
      width: 620px;
      height: 100%;
      overflow-y: auto;
      background: #fff;
      box-shadow: -10px 0 30px rgba(12, 26, 40, 0.16);
    }

    .drawer-header {

      border-bottom: 1px solid #e4e8ed;
      background: #fff;
    }

    .drawer-header h2 { margin: 0; font-size: 20px; }
    .drawer-header p { margin: 7px 0 0; color: var(--muted); font-size: 12px; }
    .close-btn { width: 30px; height: 30px; border: 0; color: #69717c; background: #f2f4f6; font-size: 18px; }
    .drawer-body { padding: 22px 24px 30px; }

    .drawer-section { margin-bottom: 24px; }
    .drawer-section h3 { margin: 0 0 12px; font-size: 15px; }
    .key-values { border: 1px solid #e5e9ee; }

    .key-value:last-child { border-bottom: 0; }
    .key-value span { padding: 10px 12px; font-size: 13px; }

    .modal {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 520px;
      padding: 24px;
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 18px 50px rgba(12, 26, 40, 0.22);
      transform: translate(-50%, -50%);
    }

    .modal h2 { margin: 0 0 12px; font-size: 20px; }
    .modal p { margin: 0; color: var(--muted); line-height: 1.7; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }

    .toast {
      position: fixed;
      top: 82px;
      right: 26px;
      z-index: 90;
      display: none;
      min-width: 270px;
      padding: 13px 16px;

      color: #fff;
      background: #25384b;

    }

      .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }

        const type = config.type || "活动积分";
        const name = config.name || "";
        const rewardId = config.rewardId || "";
        const quantity = config.quantity || "1";
        return `<div class="reward-row reward-item">
          <div><span class="mini-label">奖品类型</span><select class="select reward-type">${["活动积分", "NN虚拟道具", "N豆", "CDK", "实物"].map(item => `<option ${item === type ? "selected" : ""}>${item}</option>`).join("")}</select></div>
          <div><span class="mini-label">奖品名称快照</span><input class="input reward-name" value="${escapeHtml(name)}" placeholder="请输入奖品名称"></div>
          <div><span class="mini-label">奖励服务ID</span><input class="input reward-id" value="${escapeHtml(rewardId)}" placeholder="由奖励服务提供"></div>
          <div><span class="mini-label">数量</span><input class="input reward-qty" type="number" value="${escapeHtml(quantity)}"></div>
          <button class="remove-condition remove-reward">删除</button>
        </div>`;
      }

      function validateRewards(showSuccess = true) {
        const ids = [...document.querySelectorAll("#rewardList .reward-item")].map(row => row.querySelector("div:nth-child(3) input")?.value.trim());
        if (!ids.length || ids.some(id => !id)) {
          showToast("请先填写全部奖励服务ID");
          return false;
        }
        if (showSuccess) showToast("原型模拟：奖励服务ID校验通过；正式能力以现有奖励服务接口为准");
        return true;
      }

      function validateTaskConfiguration() {
        const roles = [...document.querySelectorAll(".condition-role")].map(select => select.value);
        if (!roles.includes("主进度条件")) {
          showToast("至少需要一个主进度条件；伴随约束条件不能单独配置");
          return false;
        }
        return validateRewards(false);
      }

      function collectTaskForm(activity) {
        const conditions = [...document.querySelectorAll("#conditions .condition-item")].map(row => ({
          role: row.querySelector(".condition-role").value,
          metricKey: row.querySelector(".indicator-select").value,
          aggregation: row.querySelector(".aggregation-select").value,
          operator: row.querySelector(".operator-select").value,
          target: row.querySelector(".target-input").value.trim(),
          filter: row.querySelector(".filter-select").value
        }));
        const rewardItems = [...document.querySelectorAll("#rewardList .reward-item")].map(row => ({
          type: row.querySelector(".reward-type").value,
          name: row.querySelector(".reward-name").value.trim(),
          rewardId: row.querySelector(".reward-id").value.trim(),
          quantity: row.querySelector(".reward-qty").value || "1"
        }));
        const condition = conditions.map(config => {
          const meta = indicatorMeta[config.metricKey];
          return `${meta.name} ${config.aggregation} ${config.operator} ${config.target}`;
        }).join(" 且 ");
        const reward = rewardItems.map(item => `${item.name || "奖励"}×${item.quantity}`).join("、");
        const customInputs = document.querySelectorAll(".custom-time input");
        const effective = $("taskTimeMode").value === "继承活动时间"
          ? "继承活动"
          : `${fromDateTimeLocal(customInputs[0]?.value)} 至 ${fromDateTimeLocal(customInputs[1]?.value)}`;
        return {
          name: $("taskNameInput").value.trim() || "未命名任务",
          category: $("taskCategoryInput").value,
          priority: $("taskPriorityInput").value || "60",
          description: $("taskDescriptionInput").value.trim(),
          cycle: $("taskResetCycleInput").value,
          effective,
          userScope: $("taskUserScopeInput").value,
          accountEligibility: $("taskAccountEligibilityInput").value,
          listFilter: $("taskListFilterInput").value,
          prerequisiteMode: $("prerequisiteMode").value,
          prerequisiteTaskId: $("prerequisiteMode").value === "无前置任务" ? "" : $("prerequisiteTaskSelect").value,
          chainId: $("taskChainSelect").value,
          conditions,
          rewardItems,
          condition,
          reward,
          updatedAt: nowText()
        };
      }

      function saveTaskDraft(strict = false) {
        if (strict && !validateTaskConfiguration()) return false;
        const activity = currentActivity();
        if (activity.status === "已归档" || activity.component?.status !== "已启用") {
          showToast("当前活动或任务组件不可编辑");
          return false;
        }
        let task = tasks.find(item => item.id === state.taskId);
        const isNew = !task;
        if (task && (task.componentInstanceId !== activity.component.id || task.status === "已停用")) {
          showToast("当前任务不可编辑，请核对组件归属或先重新启用任务");
          return false;
        }
        const formValues = collectTaskForm(activity);
        if (isNew) {
          const id = `TSK${50000 + tasks.length + 1}`;
          task = {
            id,
            activityId: activity.id,
            componentInstanceId: activity.component.id,
            code: `TASK_${id}`,
            version: "V1草稿",
            status: "草稿",
            ...formValues
          };
          tasks.push(task);
          state.taskId = id;
        } else if (task.status === "已发布") {
          const number = Number((task.version.match(/\d+/) || ["0"])[0]) + 1;
          task.draft = { ...formValues, version: `V${number}草稿` };
        } else {
          Object.assign(task, formValues);
        }
        appendOperation(activity.id, "任务", task.id, isNew ? "创建草稿" : "保存草稿", task.draft
          ? `保存 ${task.draft.version}；线上 ${task.version} 未变更`
          : `${isNew ? "创建" : "保存"}任务草稿“${task.name}”`);
        $("taskCodeInput").value = task.code;
        $("taskEditorMeta").textContent = `任务ID：${task.id}　线上版本：${task.version}　任务状态：${task.status}${task.draft ? `　待发布：${task.draft.version}` : ""}`;
        showToast(task.draft ? `${task.draft.version} 已保存，线上版本未变更` : `任务草稿已保存：${task.id}`);
        return true;
      }

      function publishTask() {
        if (!validateTaskConfiguration()) return;
        if (!saveTaskDraft(false)) return;
        const task = tasks.find(item => item.id === state.taskId);
        const nextVersion = task?.draft?.version?.replace("草稿", "") || task?.version?.replace("草稿", "") || "V1";
        $("confirmPublish").textContent = `确认发布 ${nextVersion}`;
        $("publishModal").classList.add("open");
      }

      function confirmPublishTask() {
        const task = tasks.find(item => item.id === state.taskId);
        if (!task) return;
        const activity = activityById(task.activityId);
        if (activity?.status === "已归档" || activity?.component?.status !== "已启用" || activity.component.id !== task.componentInstanceId) {
          $("publishModal").classList.remove("open");
          return showToast("组件状态或任务归属已变化，发布已中止");
        }
        if (task.draft) {
          const { version, ...publishedValues } = task.draft;
          Object.assign(task, publishedValues);
          task.version = version.replace("草稿", "");
          delete task.draft;
        } else {
          task.version = task.version.replace("草稿", "");
        }
        task.status = "已发布";
        task.updatedAt = nowText();
        appendOperation(task.activityId, "任务", task.id, "发布版本", `发布任务 ${task.version}；变更影响范围为所有用户，进行中进度迁移规则待确认`);
        $("publishModal").classList.remove("open");
        showToast(`任务 ${task.version} 已发布，未采用灰度或人群分版本`);
        setTimeout(() => navigate("task-list", { activityId: task.activityId, taskId: null }), 500);
      }

      document.addEventListener("click", event => {
        const indicator = event.target.closest("[data-indicator]");
        if (indicator) {
          openIndicatorDetail(indicator.dataset.indicator);
          return;
        }
        const pageNode = event.target.closest("[data-page]");
        if (pageNode) {
          if (pageNode.dataset.page === "activity-create") {
            state.activityFormMode = "create";
            state.editingActivityId = null;
          }
          navigate(pageNode.dataset.page);
          return;
        }
        const actionNode = event.target.closest("[data-action]");
        if (!actionNode) return;
        const action = actionNode.dataset.action;
        const activityId = actionNode.dataset.activityId;
        const taskId = actionNode.dataset.taskId;
        if (activityId) state.activityId = activityId;

        if (action === "new-activity") {
          state.activityFormMode = "create";
          state.editingActivityId = null;
          state.activityDetailTab = "basic";
          navigate("activity-create");
        }
        if (action === "edit-activity") {
          const activity = currentActivity();
          if (activity.status === "已归档") return showToast("已归档活动不可编辑");
          state.activityFormMode = "edit";
          state.editingActivityId = activity.id;
          navigate("activity-create");
        }
        if (action === "view-activity") {
          state.activityDetailTab = "basic";
          navigate("activity-detail", { activityId });
        }
        if (action === "activity-context-tab") {
          const contextTab = actionNode.dataset.contextTab;
          if (contextTab === "data") {
            navigate("data-overview");
          } else {
            state.activityDetailTab = contextTab;
            navigate("activity-detail");
          }
        }
        if (action === "add-task-component") addTaskComponent();
        if (action === "toggle-component") toggleComponent();
        if (action === "enter-task-component") navigate("task-list", { taskId: null });
        if (action === "view-current-activity") {
          state.activityDetailTab = "basic";
          navigate("activity-detail");
        }
        if (action === "view-current-activity-detail") {
          state.activityDetailTab = "components";
          navigate("activity-detail");
        }
        if (action === "pause-activity") pauseActivity();
        if (action === "filter-events") renderOperationLogs();
        if (action === "reset-events") {
          $("eventObjectFilter").value = "";
          $("eventKeyword").value = "";
          renderOperationLogs();
        }
        if (action === "filter-task-list") renderTaskList();
        if (action === "reset-task-list") {
          $("taskKeyword").value = "";
          $("taskCategory").value = "";
          $("taskStatus").value = "";
          renderTaskList();
        }
        if (action === "edit-task") navigate("task-editor", { activityId: activityId || state.activityId, taskId });
        if (action === "new-task") {
          if (currentActivity().status === "已归档" || currentActivity().component?.status !== "已启用") return showToast("当前活动或任务组件不可编辑");
          navigate("task-editor", { taskId: null });
        }
        if (action === "back-task-list") navigate("task-list", { taskId: null });
        if (action === "copy-task") copyTask(taskId);
        if (action === "toggle-task") toggleTask(taskId);
        if (action === "new-task-chain") openNewTaskChain();
        if (action === "save-task-chain") saveTaskChain();
        if (action === "close-drawer") closeDrawer();
        if (action === "view-chain") {
          const chain = taskChains.find(item => item.id === actionNode.dataset.chainId);
          if (chain) openDrawer("任务链详情", `${chain.id} · ${currentActivity().name}`, `<section class="drawer-section"><h3>${escapeHtml(chain.name)}</h3><div class="key-values"><div class="key-value"><span>重置周期</span><span>${chain.cycle}</span></div><div class="key-value"><span>推进上限</span><span>${chain.maxAdvance}</span></div><div class="key-value"><span>链内顺序</span><span>${escapeHtml(chain.steps)}</span></div><div class="key-value"><span>状态</span><span>${badge(chain.status)}</span></div></div></section><div class="info-note"><strong>校验</strong>正式保存时需校验成员均归属当前组件，且不存在循环依赖。</div>`);
        }
        if (action === "filter-participants") {
          renderParticipants();
          renderParticipationEvents();
        }
        if (action === "reset-participants") {
          $("participantKeyword").value = "";
          $("progressStatusFilter").value = "";
          $("claimStatusFilter").value = "";
          $("rewardStatusFilter").value = "";
          renderParticipants();
          renderParticipationEvents();
        }
        if (action === "view-user") openUserDetail(actionNode.dataset.userId);
      });

      document.querySelectorAll(".admin-menu-item[data-section]").forEach(button => button.addEventListener("click", () => {
        if (button.classList.contains("disabled")) return;
        const firstPage = pageConfig[button.dataset.section].tabs[0].page;
        navigate(firstPage);
      }));

      $("menuSearch").addEventListener("input", event => {
        const keyword = event.target.value.trim();
        document.querySelectorAll(".admin-menu-item").forEach(item => {
          item.style.display = !keyword || item.textContent.includes(keyword) ? "flex" : "none";
        });
      });
      $("activitySearch").addEventListener("click", () => {
        renderActivityList();
        showToast(`已筛选活动列表`);
      });
      $("activityReset").addEventListener("click", () => {
        $("activityKeyword").value = "";
        $("activitySource").value = "";
        $("activityStatus").value = "";
        $("activityPhase").value = "";
        renderActivityList();
        showToast("筛选条件已重置");
      });
      $("saveActivity").addEventListener("click", () => saveActivityForm(false));
      $("publishActivity").addEventListener("click", () => saveActivityForm(true));
      $("indicatorSearch").addEventListener("click", () => {
        const keyword = $("indicatorKeyword").value.trim().toLowerCase();
        const domain = $("indicatorDomain").value;
        const freshness = $("indicatorFreshness").value;
        const status = $("indicatorStatus").value;
        let count = 0;
        $("indicatorTableBody").querySelectorAll("tr").forEach(row => {
          const cells = row.querySelectorAll("td");
          const visible =
            (!keyword || row.textContent.toLowerCase().includes(keyword)) &&
            (!domain || cells[2]?.textContent.trim() === domain) &&
            (!freshness || cells[5]?.textContent.includes(freshness)) &&
            (!status || cells[7]?.textContent.trim() === status);
          row.hidden = !visible;
          if (visible) count += 1;
        });
        showToast(`已筛选出 ${count} 条示例指标`);
      });
      $("indicatorReset").addEventListener("click", () => {
        $("indicatorKeyword").value = "";
        $("indicatorDomain").value = "";
        $("indicatorFreshness").value = "";
        $("indicatorStatus").value = "";
        $("indicatorTableBody").querySelectorAll("tr").forEach(row => row.hidden = false);
        showToast("指标筛选已重置");
      });
      $("taskTimeMode").addEventListener("change", () => document.querySelectorAll(".custom-time").forEach(row => row.hidden = $("taskTimeMode").value !== "自定义时间"));
      $("prerequisiteMode").addEventListener("change", () => document.querySelectorAll(".prerequisite-extra").forEach(row => row.hidden = $("prerequisiteMode").value === "无前置任务"));
      $("addCondition").addEventListener("click", () => {
        const container = $("conditions");
        container.insertAdjacentHTML("beforeend", conditionTemplate(container.children.length + 1));
      });
      $("addReward").addEventListener("click", () => $("rewardList").insertAdjacentHTML("beforeend", rewardTemplate()));
      $("validateRewards").addEventListener("click", () => validateRewards(true));
      $("saveTask").addEventListener("click", () => saveTaskDraft(false));
      $("openPublishModal").addEventListener("click", publishTask);
      $("cancelPublish").addEventListener("click", () => $("publishModal").classList.remove("open"));
      $("confirmPublish").addEventListener("click", confirmPublishTask);
      $("publishModal").addEventListener("click", event => { if (event.target === $("publishModal")) $("publishModal").classList.remove("open"); });
      $("cancelConfirm").addEventListener("click", closeConfirm);
      $("confirmAction").addEventListener("click", () => confirmHandler?.());
      $("confirmModal").addEventListener("click", event => { if (event.target === $("confirmModal")) closeConfirm(); });
      $("closeDrawer").addEventListener("click", closeDrawer);
      $("drawerMask").addEventListener("click", event => { if (event.target === $("drawerMask")) closeDrawer(); });
      $("exportData").addEventListener("click", () => showToast("导出任务已创建；正式系统需记录导出权限与审计日志"));

      document.addEventListener("click", event => {
        if (event.target.classList.contains("remove-condition") && !event.target.classList.contains("remove-reward")) {
          const items = document.querySelectorAll(".condition-item");
          if (items.length === 1) return showToast("至少保留一个完成条件");
          event.target.closest(".condition-item").remove();
          document.querySelectorAll(".condition-item .condition-head strong").forEach((title, index) => title.textContent = `条件 ${index + 1}`);
        }
        if (event.target.classList.contains("remove-reward")) {
          const rewards = document.querySelectorAll(".reward-item");
          if (rewards.length === 1) return showToast("至少保留一个奖品");
          event.target.closest(".reward-item").remove();
        }
      });

      document.addEventListener("change", event => {
        if (!event.target.classList.contains("indicator-select")) return;
        const box = event.target.closest(".condition-item");
        const meta = indicatorMeta[event.target.value];
        box.querySelector(".metric-chip").textContent = `数据更新：${meta.freshness}`;
        box.querySelector(".aggregation-select").innerHTML = meta.aggregation.split("、").map(item => `<option>${item}</option>`).join("");
        box.querySelector(".operator-select").value = meta.type === "事件" ? "等于 =" : "大于等于 ≥";
        box.querySelector(".target-input").value = meta.type === "事件" ? "已发生" : "1";
        box.querySelector(".filter-select").innerHTML = `<option>按指标维度配置：${escapeHtml(meta.filters)}</option>`;
        box.querySelector(".condition-summary").textContent = `指标口径：${meta.definition}；单位：${meta.unit}；可用于：${meta.usage}。`;
      });

      document.addEventListener("keydown", event => {
        if (event.key !== "Escape") return;
        closeDrawer();
        closeConfirm();
        $("publishModal").classList.remove("open");
      });

      renderActivityList();
      navigate("activity-list");
    })();
  </script>
</body>
</html>
